# data/agents/amp_task_humanoid_agent.yaml; the changes are listed in
# experiments/amp_humanoid/CHANGES.md of the TOPPO release.

# PPO HL-Gauss probe: is the arm's value-tracking deficit the METHOD or the
# critic step size?
#
# At 20M samples the shipped hlgauss arm reaches Toppo_Return_Mean_Task_Reward
# 2.68 vs the PopArt control's 4.76 (Test_Return 12.7 vs 20.8), with
# w5_hlgauss_oob_frac = 0.000 -- so it is NOT support saturation. The critic
# optimizer (SGD lr 1e-4, grad_clip 1.0) was tuned for a 1-output scalar head;
# a 141-logit categorical head has to move softmax mass across many bins under
# the same clipped step. Reporting "HL-Gauss underperforms PopArt" without
# testing this would measure a step-size mismatch, not the method.
#
# this probe raises the critic learning rate 10x (1e-4 -> 1e-3).
agent_name: W5AMP
model:
  actor_net: fc_2layers_1024units
  actor_init_output_scale: 0.01
  actor_std_type: FIXED
  action_std: 0.05
  critic_net: fc_2layers_1024units
  disc_net: fc_2layers_1024units
actor_optimizer:
  type: SGD
  learning_rate: 5e-5
critic_optimizer:
  type: SGD
  learning_rate: 0.001
  grad_clip: 1.0
disc_optimizer:
  type: SGD
  learning_rate: 0.00025
  weight_decay: 0.0001
discount: 0.99
steps_per_iter: 32
iters_per_output: 10
test_episodes: 32
normalizer_samples: 100000000
use_mixed_precision: false
actor_epochs: 5
actor_batch_size: 4
critic_epochs: 2
critic_batch_size: 2
disc_epochs: 2
disc_batch_size: 2
td_lambda: 0.95
ppo_clip_ratio: 0.2
norm_adv_clip: 4.0
action_bound_weight: 10.0
action_entropy_weight: 0.0
action_reg_weight: 0.0
disc_buffer_size: 200000
disc_replay_samples: 1000
disc_logit_reg: 0.01
disc_grad_penalty: 5
disc_reward_scale: 2
task_reward_weight: 0.5
disc_reward_weight: 0.5
toppo:
  enabled: true
  num_tasks: 2
  task_names:
  - task_reward
  - disc_reward
  actor_components: false
  actor_method: default
  critic_method: default
  fairgrad_alpha: 1.0
  fairgrad_rescale: false
  critic_layer_norm: true
  critic_layer_norm_biasless: true
  use_popart: false
w5_norm:
  method: hlgauss
  hlgauss_num_bins: 141
  hlgauss_vmin: -10.0
  hlgauss_vmax: 60.0
  hlgauss_sigma_ratio: 0.75
