# Reward normalization + HL-Gauss, 101-bin CONTROL (MT50-V1).
# Tests whether reward normalization, by bringing the per-task value targets
# into similar ranges, lets a single HL-Gauss support range serve all tasks.
# Parents: ppo_mt50_hlgauss_lnc_rfv1.yaml (critic side) + ppo_mt50_rewnormnovc_lnc_rfv1.yaml (env side).
# Trunk hyperparameters inherited verbatim -- no per-arm tuning.
# MECHANISM CONTROL (3 seeds).  Identical to hlgaussrewnorm_lnc_rfv1 except
# num_bins stays at the campaign's inherited 101 and the support is [-6, 25]
# instead of [-10, 30]: at 101 bins coverage and resolution cannot both be
# met, and span 31 is the smallest that keeps clipping <= 1e-4.  That forces
# bin width 0.307 -- about 4x the tightest measured per-task target sd
# (0.062-0.083).  If this fails while the finer-binned arm recovers, the
# binding constraint is bin RESOLUTION, not reward scale.

project_name: toppo-repro
exp_name: ppo_mt50_ad_cd_hlgaussrewnorm101_lnc_rfv1
seed: 0
device: cuda
algo: ppo
use_linear_baseline: false

env:
  env_name: MT50
  max_episode_steps: 500
  use_one_hot: true
  num_tasks: 50
  terminate_on_success: false
  task_select: random
  reward_normalization_method: baselines_return
  reward_norm_clip: 10.0
  num_envs: 50
  reward_function_version: v1

network:
  preprocess_net: []
  actor: [400, 400, 400]
  critic: [400, 400, 400]
  actor_head: []
  critic_head: []
  activation: relu
  ln_critic: true

training:
  epoch: 100
  step_per_epoch: 1000000
  step_per_collect: 500000
  repeat_per_collect: 16
  batch_size: 15625
  minibatch_sampling: stratified
  learning_rate: 0.0003
  gamma: 0.99
  max_grad_norm: 1.0

ppo:
  gae_lambda: 0.97
  clip_range: 0.2
  value_clip: false
  vf_coef: 0.001
  ent_coef: 0.005
  advantage_normalization: true
  recompute_advantage: true
  use_popart: false
  popart_min_std: 0.01
  use_return_scaling: false
  return_scaling_min_sigma: 0.01
  critic_loss_mode: hlgauss
  hlgauss_num_bins: 101
  hlgauss_vmin: -6.0
  hlgauss_vmax: 25.0
  hlgauss_sigma_ratio: 0.75

gradient:
  actor_method: default
  critic_method: default

logging:
  use_wandb: true
  use_tensorboard: false
  use_csv: true
  train_interval: 2000
  test_interval: 2
  update_interval: 1
  info_interval: 1
  save_interval: 1000000
  save_best: false
  log_dir: logs
  wandb_group: ppo_mt50_ad_cd_hlgaussrewnorm101_lnc_rfv1
  wandb_tags: [mt50, rfv1, lnc]
