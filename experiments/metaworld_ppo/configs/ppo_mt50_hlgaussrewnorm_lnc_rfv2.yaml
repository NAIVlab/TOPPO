# Reward normalization + HL-Gauss (MT50-V2).
# Tests whether reward normalization, by bringing the per-task value targets
# into similar ranges, lets a single HL-Gauss support range serve all tasks.
# Parents: ppo_mt50_hlgauss_lnc_rfv2.yaml (critic side) + ppo_mt50_rewnorm_lnc_rfv2.yaml (env side).
# Trunk hyperparameters inherited verbatim -- no per-arm tuning.
# Support re-derived for the NORMALIZED scale (mandatory: the raw-V1 support
# [-8e5, 1.6e6] would put all 50 tasks in a single bin).  Measured over 10
# finished rewnormnovc_rfv2 seeds: data/returns_mean ~2.6-2.8, std 0.78-1.26,
# min ~-0.5, max spikes to 16.3.  Support [-4.0, 32.0] @ 600 bins => bin width 0.060.
# Smoke (4M steps, s0) at [-4,20]@400: min_i target_std_bins=2.43 (fine) but
# data/returns_max=66 and 2 tasks clipped >1e-3, so vmax widened to 32 at the
# same bin width.

project_name: toppo-repro
exp_name: ppo_mt50_ad_cd_hlgaussrewnorm_lnc_rfv2
seed: 0
device: cuda
algo: ppo
use_linear_baseline: false

env:
  env_name: MT50
  max_episode_steps: 500
  use_one_hot: true
  num_tasks: 50
  terminate_on_success: false
  task_select: random
  reward_normalization_method: baselines_return
  reward_norm_clip: 10.0
  num_envs: 50
  reward_function_version: v2

network:
  preprocess_net: []
  actor: [400, 400, 400]
  critic: [400, 400, 400]
  actor_head: []
  critic_head: []
  activation: relu
  ln_critic: true

training:
  epoch: 100
  step_per_epoch: 1000000
  step_per_collect: 500000
  repeat_per_collect: 16
  batch_size: 15625
  minibatch_sampling: stratified
  learning_rate: 0.0003
  gamma: 0.99
  max_grad_norm: 1.0

ppo:
  gae_lambda: 0.97
  clip_range: 0.2
  value_clip: false
  vf_coef: 0.001
  ent_coef: 0.005
  advantage_normalization: true
  recompute_advantage: true
  use_popart: false
  popart_min_std: 0.01
  use_return_scaling: false
  return_scaling_min_sigma: 0.01
  critic_loss_mode: hlgauss
  hlgauss_num_bins: 600
  hlgauss_vmin: -4.0
  hlgauss_vmax: 32.0
  hlgauss_sigma_ratio: 0.75

gradient:
  actor_method: default
  critic_method: default

logging:
  use_wandb: true
  use_tensorboard: false
  use_csv: true
  train_interval: 2000
  test_interval: 2
  update_interval: 1
  info_interval: 1
  save_interval: 1000000
  save_best: false
  log_dir: logs
  wandb_group: ppo_mt50_ad_cd_hlgaussrewnorm_lnc_rfv2
  wandb_tags: [mt50, rfv2, lnc]
